name: Public tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  public:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts
      - run: python -m pip install pillow numpy jsonschema
      - name: Check browser runtime
        run: test -x /usr/bin/google-chrome
      - run: npm test
      - run: npm run test:mcp-connect
      - name: Connect to the installed npm package
        if: matrix.node == 22
        run: |
          package_dir=$(mktemp -d)
          package_file=$(npm pack --ignore-scripts --pack-destination "$package_dir" --json | node -p 'JSON.parse(require("node:fs").readFileSync(0, "utf8"))[0].filename')
          npm install --ignore-scripts --no-audit --no-fund --prefix "$package_dir/install" "$package_dir/$package_file"
          ZEE_MCP_ENTRY="$package_dir/install/node_modules/zee-rp/bin/mcp.mjs" npm run test:mcp-connect
      - run: npm run test:styles
      - run: npm run test:sync
      - run: npm run test:studio-ai
        timeout-minutes: 10
        env:
          CHROME_BIN: /usr/bin/google-chrome
      - run: npm run test:studio-parity
      - run: npm run test:layers
      - run: npm run test:studio-editing
        env:
          CHROME_BIN: /usr/bin/google-chrome
      - run: npm run test:studio-finish
        env:
          CHROME_BIN: /usr/bin/google-chrome
      - run: npm run test:studio-baselines
      - run: npm run test:scripted-validate
      - run: npm run test:attribution
        env:
          CHROME_BIN: /usr/bin/google-chrome
      - run: python test/rp-feedback-layout-check.py
      - run: python test/rp-source-contract-check.py
